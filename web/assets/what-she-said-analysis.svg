<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc">
  <title id="title">What she said about the incident surprised everyone 主从结构标注图</title>
  <desc id="desc">按照手写笔记的形式，在同一句话上方标出从句内部的宾语、主语、谓语和状语，在下方标出主句的主语、谓语和宾语。What 同时是连接词和从句宾语。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b42332"/>
    </marker>
    <style>
      .sentence { font: 700 42px "Segoe UI", Arial, sans-serif; fill: #15171b; }
      .level { font: 800 24px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #4e5969; }
      .mark { font: 800 27px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #b42332; }
      .note { font: 800 23px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #b42332; }
      .small { font: 700 19px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #b42332; }
      .red-line { fill: none; stroke: #b42332; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .thin-line { fill: none; stroke: #b42332; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1280" height="500" fill="#ffffff"/>

  <text class="level" x="58" y="46">从句内部</text>

  <text class="mark" x="90" y="107">宾 / 连</text>
  <text class="mark" x="257" y="107">主</text>
  <text class="mark" x="380" y="107">谓</text>
  <text class="mark" x="596" y="107">状</text>

  <rect class="red-line" x="55" y="130" width="145" height="82" rx="5"/>
  <path class="thin-line" d="M230 219 Q273 231 316 219"/>
  <path class="thin-line" d="M340 219 Q390 231 440 219"/>
  <path class="thin-line" d="M465 219 Q637 235 810 219"/>

  <text class="sentence" x="72" y="190">What</text>
  <text class="sentence" x="232" y="190">she</text>
  <text class="sentence" x="343" y="190">said</text>
  <text class="sentence" x="466" y="190">about the incident</text>
  <text class="sentence" x="838" y="190">surprised</text>
  <text class="sentence" x="1060" y="190">everyone</text>

  <path class="red-line" d="M55 258 V280 H808 V258"/>
  <path class="red-line" d="M838 258 H1025"/>
  <path class="red-line" d="M1060 258 H1240"/>

  <text class="level" x="58" y="342">主句</text>
  <text class="mark" x="392" y="324">主</text>
  <text class="mark" x="910" y="324">谓</text>
  <text class="mark" x="1130" y="324">宾</text>
  <text class="small" x="322" y="361">名词性从句整体作主语</text>

  <path class="thin-line" d="M126 220 C130 330 176 398 264 413" marker-end="url(#arrow)"/>
  <text class="note" x="280" y="414">连接词 + 从句宾语</text>
  <text class="small" x="346" y="448">What 的双重属性</text>
</svg>
