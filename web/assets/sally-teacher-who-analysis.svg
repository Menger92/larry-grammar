<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Sally is a teacher who is warm-hearted, hardworking, and quick in learning 句子结构分析图</title>
  <desc id="desc">主句是 Sally is a teacher，其中 Sally 是主语，is 是谓语或系动词，a teacher 是主语补语或表语。who is warm-hearted, hardworking, and quick in learning 是形容词性从句，修饰先行词 teacher。who 是关系代词，既连接定语从句，又在从句内部作主语，并回指 teacher。</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f4e79"/>
    </marker>
    <marker id="arrowAdj" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b8860b"/>
    </marker>
    <style>
      .bg { fill: #f7f9fd; }
      .card { fill: #ffffff; stroke: #d9e1ee; stroke-width: 2; }
      .panel { fill: #f9fbff; stroke: #d9e1ee; stroke-width: 2; }
      .title { font: 800 30px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #172033; }
      .sub { font: 600 18px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #5d687a; }
      .label { font: 800 17px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #243044; }
      .small { font: 700 15px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #536072; }
      .word { font: 800 27px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #172033; }
      .wordSmall { font: 800 24px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #172033; }
      .cn { font: 800 18px "Microsoft YaHei", "Segoe UI", sans-serif; }
      .nounFill { fill: #ffe8eb; stroke: #c1121f; }
      .adjFill { fill: #fff7bf; stroke: #b8860b; }
      .predFill { fill: #eef2f7; stroke: #7a8495; }
      .connFill { fill: #edf3fa; stroke: #1f4e79; }
      .nounText { fill: #c1121f; }
      .adjText { fill: #b8860b; }
      .predText { fill: #3f4754; }
      .blueText { fill: #1f4e79; }
      .lineNoun { stroke: #c1121f; stroke-width: 4; fill: none; stroke-linecap: round; }
      .lineAdj { stroke: #b8860b; stroke-width: 4; fill: none; stroke-linecap: round; }
      .linePred { stroke: #7a8495; stroke-width: 4; fill: none; stroke-linecap: round; }
      .arrowText { font: 800 16px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #1f4e79; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="720"/>
  <rect class="card" x="42" y="38" width="1196" height="644" rx="18"/>

  <text class="title" x="76" y="88">形容词性从句结构分析图</text>
  <text class="sub" x="76" y="119">Sally is a teacher who is warm-hearted, hardworking, and quick in learning.</text>

  <text class="label" x="82" y="157">主句结构：Sally is a teacher</text>
  <rect class="nounFill" x="82" y="178" width="170" height="78" rx="12"/>
  <rect class="predFill" x="282" y="178" width="120" height="78" rx="12"/>
  <rect class="nounFill" x="432" y="178" width="210" height="78" rx="12"/>
  <rect class="adjFill" x="692" y="178" width="456" height="78" rx="12"/>

  <text class="word" x="126" y="226">Sally</text>
  <text class="word" x="326" y="226">is</text>
  <text class="word" x="474" y="226">a teacher</text>
  <text class="wordSmall" x="724" y="226">who is warm-hearted...</text>

  <path class="lineNoun" d="M102 276 H232"/>
  <path class="linePred" d="M303 276 H382"/>
  <path class="lineNoun" d="M452 276 H623"/>
  <path class="lineAdj" d="M712 276 H1128"/>

  <text class="cn nounText" x="121" y="309">主句主语</text>
  <text class="cn predText" x="302" y="309">系动词 / 谓语</text>
  <text class="cn nounText" x="452" y="309">主语补语 / 表语</text>
  <text class="cn adjText" x="765" y="309">形容词性从句：修饰 teacher</text>

  <path d="M730 255 C654 322 566 327 526 260" stroke="#b8860b" stroke-width="4" fill="none" marker-end="url(#arrowAdj)"/>
  <text class="arrowText" x="575" y="351">定语从句回头修饰先行词</text>

  <rect class="panel" x="82" y="382" width="1066" height="208" rx="16"/>
  <text class="label" x="112" y="418">从句内部：who is warm-hearted, hardworking, and quick in learning</text>
  <text class="small" x="112" y="448">还原理解：the teacher is warm-hearted, hardworking, and quick in learning</text>

  <rect class="connFill" x="112" y="480" width="140" height="68" rx="10"/>
  <rect class="predFill" x="282" y="480" width="105" height="68" rx="10"/>
  <rect class="adjFill" x="417" y="470" width="560" height="86" rx="10"/>

  <text class="word" x="154" y="523">who</text>
  <text class="word" x="322" y="523">is</text>
  <text class="wordSmall" x="448" y="507">warm-hearted, hardworking,</text>
  <text class="wordSmall" x="448" y="536">and quick in learning</text>

  <path class="lineNoun" d="M126 564 H238"/>
  <path class="linePred" d="M300 564 H370"/>
  <path class="lineAdj" d="M435 572 H960"/>

  <text class="cn blueText" x="112" y="613">关系代词：连接从句</text>
  <text class="cn nounText" x="318" y="613">从句主语</text>
  <text class="cn predText" x="450" y="613">从句系动词</text>
  <text class="cn adjText" x="640" y="613">从句主语补语 / 表语：说明 who 的特征</text>

  <rect class="card" x="1010" y="411" width="112" height="138" rx="12"/>
  <text class="label blueText" x="1035" y="444">who</text>
  <text class="small" x="1028" y="474">双重身份</text>
  <text class="cn blueText" x="1027" y="506">1. 关系词</text>
  <text class="cn nounText" x="1027" y="535">2. 从句主语</text>
  <path d="M1010 470 C865 418 714 342 577 255" stroke="#1f4e79" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M1010 520 C760 615 415 620 190 553" stroke="#c1121f" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>

  <text class="small" x="82" y="654">阅读顺序：先看主句 Sally is a teacher，再看 who 引导的定语从句如何修饰 teacher。</text>
</svg>
